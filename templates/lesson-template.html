<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 標題格式：第 N 課：標題｜穿越機新手飛行教室 -->
  <title>第 N 課：標題｜穿越機新手飛行教室</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a href="../index.html">🚁 穿越機新手飛行教室</a>
      <a href="../index.html">課程目錄</a>
    </div>
  </header>

  <main class="wrap">
    <!-- 1. 標題區 -->
    <div class="lesson-head">
      <div class="no">第 N 課</div>
      <h1>標題</h1>
      <p class="lead">一句話簡介。</p>
    </div>

    <!-- 2. 學習目標（2–4 點，「能夠……」句型） -->
    <section class="block">
      <h2>🎯 學習目標</h2>
      <ul>
        <li>能夠……</li>
      </ul>
    </section>

    <!-- 3. 事前準備 -->
    <section class="block">
      <h2>🧰 事前準備</h2>
      <ul>
        <li>……</li>
      </ul>
    </section>

    <!-- 4. 練習步驟（編號，每步一個動作） -->
    <section class="block">
      <h2>🪜 練習步驟</h2>
      <ol>
        <li>……</li>
      </ol>
    </section>

    <!-- 5. 常見錯誤（現象 → 原因 → 解法） -->
    <section class="block">
      <h2>⚠️ 常見錯誤</h2>
      <div class="mistake"><b>現象</b> → 原因 → 解法</div>
    </section>

    <!-- 6. 過關檢查（3–5 項 checkbox） -->
    <section class="block">
      <h2>✅ 過關檢查</h2>
      <ul class="checklist">
        <li><label><input type="checkbox"> 檢查項目</label></li>
      </ul>
    </section>

    <!-- 7. 安全提醒（固定句，不可刪） -->
    <div class="safety">🛟 安全提醒：請依當地法規與場地規定飛行，並留意周遭人員安全。</div>

    <!-- 8. 上一課／下一課（第一課無上一課、最後一課無下一課，用 spacer 補位） -->
    <nav class="pager">
      <a href="NN-prev.html">← 上一課</a>
      <a href="NN-next.html">下一課 →</a>
    </nav>
  </main>

  <footer>穿越機新手飛行教室 · 邊玩邊練，慢慢進步 🌈</footer>
</body>
</html>
